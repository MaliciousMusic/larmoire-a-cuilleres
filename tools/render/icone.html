<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style> html, body { margin: 0; background: transparent; } #ic { width: 512px; height: 512px; display: block; } </style></head>
<body><svg id="ic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"></svg>
<script src="../../js/ac-core.js"></script><script src="../../js/ac-brand.js"></script><script src="cuillere-anneau.js"></script>
<script>
// L'icône d'appli : leur cuillère ciselée (celle du logo), pliée en cercle comme une bague-cuillère,
// au trait noir sur fond blanc (le cuilleron et le haut du manche se rejoignent en haut).
// ?k=0.8 : version « maskable » (tout dans le cercle de sécurité d'Android) ; ?trait= : épaissit le trait
// (le petit favicon en a besoin).
(() => {
  const q = new URLSearchParams(location.search);
  const k = +(q.get('k') || 1), trait = +(q.get('trait') || 2.8);
  const svg = document.getElementById('ic');
  AC.svg('rect', { width: 512, height: 512, fill: '#FFFFFF' }, svg);
  const g = AC.svg('g', { transform: `translate(256 256) scale(${k}) translate(-256 -256)` }, svg);
  const a = AC.cuillereAnneau({ cx: 256, cy: 256, R: 158, debut: -88, tour: 356, epais: 0.62 });
  if (a) {
    if (a.fill) AC.svg('path', { d: a.fill, fill: '#FFFFFF' }, g);
    AC.svg('path', { d: a.lines, fill: '#111111', stroke: '#111111', 'stroke-width': trait, 'stroke-linejoin': 'round' }, g);
  }
  document.body.dataset.pret = '1';
})();
</script></body></html>
